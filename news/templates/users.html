
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        .user {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        a {
            color: #e30613;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>Users</h1>

{% for user in data1 %}

<div class="user">

    <p>
        Name: {{ user.name }}
    </p>

    <p>
        Age: {{ user.age }}
    </p>

    <p>
        City: {{ user.city }}
    </p>

    <a href="{% url 'details1' user.id %}">
        Details →
    </a>

</div>

{% empty %}

<p>No users found.</p>

{% endfor %}

<br>

<a href="{% url 'home' %}">← Back to Home</a>

</body>
</html>
