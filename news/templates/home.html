<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>News Portal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f3f3;
            color: #222;
        }

        /* HEADER */

        header {
            background: #111;
            color: white;
            border-bottom: 4px solid #e30613;
        }

        .top {
            max-width: 1200px;
            margin: auto;
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo span {
            color: #e30613;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #e30613;
        }


        /* BREAKING NEWS */

        .breaking {
            background: #e30613;
            color: white;
        }

        .breaking-content {
            max-width: 1200px;
            margin: auto;

            height: 45px;

            display: flex;
            align-items: center;
        }

        .breaking-title {
            background: #111;
            height: 45px;

            padding: 0 20px;

            display: flex;
            align-items: center;

            font-weight: bold;
            margin-right: 20px;
        }


        /* MAIN */

        .container {
            max-width: 1200px;
            margin: 35px auto;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 25px;
        }

        .section-title h1 {
            font-size: 28px;
        }

        .red-line {
            width: 6px;
            height: 30px;
            background: #e30613;
        }


        /* NEWS GRID */

        .news-grid {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 22px;
        }


        /* CARD */

        .news-card {
            background: white;

            border-radius: 5px;

            overflow: hidden;

            box-shadow: 0 3px 12px rgba(0,0,0,0.08);

            transition: 0.25s;
        }

        .news-card:hover {
            transform: translateY(-6px);

            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }


        .card-top {
            height: 7px;
            background: #e30613;
        }


        .card-content {
            padding: 22px;
        }


        .category {
            color: #e30613;

            font-size: 12px;

            font-weight: bold;

            text-transform: uppercase;

            margin-bottom: 10px;
        }


        .news-card h2 {
            font-size: 20px;

            line-height: 1.3;

            margin-bottom: 18px;
        }


        .details {
            display: inline-block;

            background: #111;

            color: white;

            padding: 10px 18px;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;

            border-radius: 3px;

            transition: 0.2s;
        }


        .details:hover {
            background: #e30613;
        }


        /* FOOTER */

        footer {
            margin-top: 60px;

            background: #111;

            color: #aaa;

            text-align: center;

            padding: 30px;
        }

        footer strong {
            color: white;
        }


        /* RESPONSIVE */

        @media (max-width: 900px) {

            .news-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .top {
                padding: 0 20px;
            }

        }


        @media (max-width: 600px) {

            .news-grid {
                grid-template-columns: 1fr;
            }

            nav {
                display: none;
            }

            .logo {
                font-size: 26px;
            }

            .container {
                margin: 25px 15px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="top">

        <div class="logo">
            OFFSIDE<span>PLUS</span>
        </div>

        <nav>
            <a href="#">Futbol</a>
            <a href="#">Basketbol</a>
            <a href="#">UFC</a>
            <a href="#">Xəbərlər</a>
        </nav>

    </div>

</header>


<div class="breaking">

    <div class="breaking-content">

        <div class="breaking-title">
            SON XƏBƏRLƏR
        </div>

        <div>
            İdman dünyasından ən son xəbərlər
        </div>

    </div>

</div>


<main class="container">


    <div class="section-title">

        <div class="red-line"></div>

        <h1>Son Xəbərlər</h1>

    </div>


    <div class="news-grid">


        {% for item in news %}

        <article class="news-card">

            <div class="card-top"></div>

            <div class="card-content">

                <div class="category">
                    İDMAN
                </div>

                <h2>
                    {{ item.title }}
                </h2>

                <a
                    class="details"
                    href="{% url 'details' item.id %}"
                >
                    ƏTRAFLI OXU →
                </a>

            </div>

        </article>

        {% endfor %}


    </div>


</main>


<footer>

    <strong>OFFSIDEPLUS</strong>

    <br><br>

    İdman xəbərləri portalı © 2026

</footer>


</body>

</html>
