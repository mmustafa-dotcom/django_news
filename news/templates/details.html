
{% load static %}

<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ news.title }}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f3f3;
            color: #222;
        }

        header {
            background: #111;
            border-bottom: 4px solid #e30613;
        }

        .top {
            max-width: 1100px;
            margin: auto;
            height: 75px;
            display: flex;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 32px;
            font-weight: 900;
        }

        .logo span {
            color: #e30613;
        }

        .article {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 45px;
            border-radius: 5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .category {
            color: #e30613;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 38px;
            line-height: 1.2;
            margin-bottom: 25px;
        }

        .line {
            width: 70px;
            height: 5px;
            background: #e30613;
            margin-bottom: 30px;
        }

        .article img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .content {
            font-size: 18px;
            line-height: 1.8;
            color: #333;
        }

        .back {
            display: inline-block;
            margin-top: 35px;
            padding: 12px 22px;
            background: #111;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 3px;
        }

        .back:hover {
            background: #e30613;
        }

        @media (max-width: 600px) {
            .article {
                margin: 20px 15px;
                padding: 25px;
            }

            h1 {
                font-size: 28px;
            }

            .content {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="top">
        <div class="logo">
            OFFSIDE<span>PLUS</span>
        </div>
    </div>
</header>

<main class="article">

    <div class="category">
        İDMAN XƏBƏRLƏRİ
    </div>

    <h1>{{ news.title }}</h1>

    <div class="line"></div>

    {% if news.image %}
        <img src="{% static news.image %}" alt="{{ news.title }}">
    {% endif %}

    <div class="content">
        <p style="white-space: pre-line;">{{ news.content }}</p>
    </div>

    <a class="back" href="{% url 'home' %}">
        ← XƏBƏRLƏRƏ QAYIT
    </a>

</main>

</body>
</html>
