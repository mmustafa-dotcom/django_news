
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            max-width: 500px;
        }

        p {
            font-size: 18px;
        }

        a {
            color: #e30613;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>User Details</h1>

    <p>Name: {{ data.name }}</p>

    <p>Age: {{ data.age }}</p>

    <p>City: {{ data.city }}</p>

    <p>Email: {{ data.email }}</p>

    <a href="{% url 'users' %}">← Back to Users</a>

</div>

</body>
</html>
