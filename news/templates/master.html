
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        h1 {
            color: #222;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            margin-right: 15px;
            color: #e30613;
            text-decoration: none;
            font-weight: bold;
        }

        .content {
            background: white;
            padding: 25px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<h1>My Website</h1>

<nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'people' %}">People</a>
    <a href="{% url 'students' %}">Students</a>
    <a href="{% url 'users' %}">Users</a>
</nav>

<hr>

<div class="content">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
